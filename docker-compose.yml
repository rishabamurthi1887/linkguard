services:
  linkguard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LINKGUARD_DB: /data/linkguard.db
      LINKGUARD_CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      LINKGUARD_RATE_LIMIT_PER_MINUTE: ${LINKGUARD_RATE_LIMIT_PER_MINUTE:-30}
      LINKGUARD_COOKIE_SECURE: ${LINKGUARD_COOKIE_SECURE:-false}
      LINKGUARD_SESSION_TTL_SECONDS: ${LINKGUARD_SESSION_TTL_SECONDS:-86400}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      WEBRISK_API_KEY: ${WEBRISK_API_KEY:-}
    volumes:
      - linkguard-data:/data
    restart: unless-stopped
volumes:
  linkguard-data:
